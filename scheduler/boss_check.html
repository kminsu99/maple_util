<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보스 체크</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../base_css/base.css">
    <link rel="stylesheet" href="../base_css/dark.css">
    <link rel="stylesheet" href="../base_css/light.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/difficulty_badge.css">
    <link rel="stylesheet" href="css/api_key_box.css">
    <!-- 상단 고정 헤더 · 버튼 모양은 scheduler.html과 공용 -->
    <link rel="stylesheet" href="css/scheduler.css">
    <!-- 저장된 테마를 그리기 전에 적용 (깜빡임 방지) -->
    <script src="../base_js/theme.js"></script>
    <style>
        /* ── 보스 체크 전용 스타일 (색상 변수는 base_css/dark.css · light.css) ── */
        .bc-wrap {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* ── 상단 메뉴: [전체 요약] [프로파일 탭들] ······ [붙여넣기] [백업] [설정] ── */
        .bc-menu {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
        }

        .bc-menu .menu-sep {
            flex: 1 1 auto;
        }

        .bc-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        /* 지금 보고 있는 화면 버튼 */
        .top-btn.is-active {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--on-accent);
        }

        .btn {
            padding: 6px 12px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font: inherit;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn:hover {
            border-color: var(--accent);
            color: var(--text-bright);
        }

        .btn.is-primary {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn.is-danger:hover {
            border-color: var(--red);
            color: var(--red);
        }

        .btn-sm {
            padding: 3px 8px;
            font-size: 0.74rem;
        }

        /* ── 카드 ── */
        .bc-card {
            margin-bottom: 18px;
            padding: 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 4px 16px var(--shadow);
        }

        .card-head {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .card-head h2 {
            font-size: 1rem;
            font-weight: 800;
            color: var(--text-bright);
        }

        .card-head .grow {
            flex: 1 1 auto;
        }

        .counter {
            padding: 2px 10px;
            border-radius: 999px;
            background: var(--surface2);
            border: 1px solid var(--border);
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent);
        }

        .muted {
            color: var(--muted);
            font-size: 0.8rem;
        }

        .empty {
            padding: 24px 8px;
            text-align: center;
            color: var(--muted);
            font-size: 0.85rem;
            line-height: 1.7;
        }

        /* ── 프로파일 머리 (캐릭 정보 + 버튼) ── */
        .ph {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }

        .bc-card .ph + .sched {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .ph-info {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex: 1 1 auto;
        }

        .ph-level {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--accent);
        }

        .ph-name {
            font-size: 1.35rem;
            font-weight: 900;
            color: var(--text-bright);
        }

        .ph-job {
            font-size: 0.9rem;
            color: var(--muted);
        }

        .ph-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        /* ── 보스 스케줄 표 ── */
        .table-scroll {
            overflow-x: auto;
        }

        .boss-table {
            width: 100%;
            min-width: 860px;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .boss-table th {
            padding: 6px 8px;
            border-bottom: 1px solid var(--border);
            color: var(--muted);
            font-size: 0.75rem;
            font-weight: 700;
            text-align: center;
            white-space: nowrap;
            vertical-align: bottom;
        }

        .boss-table td {
            padding: 6px 8px;
            border-bottom: 1px solid var(--border);
            text-align: center;
            vertical-align: middle;
        }

        /* 표 맨 윗줄: [보스 스케줄 0/13 ... 총 예상시간 · 남은 시간] (예상시간 칸 오른쪽 끝까지) | [도핑메모] */
        .boss-table .group-row th {
            padding: 0 8px 8px;
            vertical-align: bottom;
        }

        .boss-table .group-row .sched-title {
            padding-left: 0;
            text-align: left;
            color: var(--text);
            font-size: 0.82rem;
            font-weight: 400;
        }

        .sched-title .card-head {
            margin-bottom: 0;
        }

        /* 총 예상시간 / 남은 시간 두 줄, 오른쪽 정렬 */
        .sched-total {
            display: inline-flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
            white-space: nowrap;
        }

        .sched-total strong {
            color: var(--text-bright);
            font-weight: 800;
        }

        .boss-table .group-row .dop-head {
            color: var(--text-bright);
            font-size: 0.8rem;
            font-weight: 800;
            text-align: center;
        }

        /* 클리어 행: 취소선 + 흐리게 (클리어 체크칸은 그대로) */
        .boss-table tbody tr.is-cleared td {
            opacity: 0.55;
        }

        .boss-table tbody tr.is-cleared td.col-clear {
            opacity: 1;
        }

        /* 내 배율 칸: 팝업까지 흐려지지 않게 칸 대신 버튼만 흐리게 */
        .boss-table tbody tr.is-cleared td.col-my {
            opacity: 1;
        }

        .boss-table tbody tr.is-cleared td.col-my .my-btn {
            opacity: 0.55;
        }

        .boss-table tbody tr.is-cleared .boss-name,
        .boss-table tbody tr.is-cleared .time-main {
            text-decoration: line-through;
            text-decoration-thickness: 2px;
        }

        /* 클리어 체크칸: API 값만 표시 (직접 선택 불가) */
        .clear-check {
            width: 18px;
            height: 18px;
            accent-color: var(--green);
            pointer-events: none;
        }

        .clear-check:disabled {
            opacity: 1;
        }

        .col-dif {
            width: 1%;
        }

        /* 내 배율 + 인원 × 배율 = 예상시간 */
        .boss-table .col-op {
            width: 1%;
            padding-left: 0;
            padding-right: 0;
            color: var(--muted);
            font-size: 1rem;
            font-weight: 700;
        }

        .col-boss {
            text-align: left !important;
        }

        .boss-name {
            font-weight: 700;
            color: var(--text-bright);
            white-space: nowrap;
        }

        .tag-monthly {
            margin-left: 6px;
            padding: 0 6px;
            border-radius: 6px;
            border: 1px solid var(--gauge-monthly);
            color: var(--gauge-monthly);
            font-size: 0.66rem;
            font-weight: 700;
            line-height: 16px;
            white-space: nowrap;
        }

        /* 내 배율: 누르면 난이도별 csv 배율 목록, 고르면 저장 */
        .col-my {
            position: relative;
        }

        /* 팝업이 열린 칸은 아래 행(흐린 행 포함)보다 위에 그림 */
        .col-my:has(.rate-pop:not([hidden])) {
            z-index: 40;
        }

        .my-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font: inherit;
            font-size: 0.82rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .my-btn:hover,
        .my-btn[aria-expanded="true"] {
            border-color: var(--accent);
        }

        .my-btn.is-picked {
            border-color: var(--blue);
            color: var(--blue);
            font-weight: 700;
        }

        /* 배율 자리 고정: 숫자 "xxxxx.xx"(8ch, 고정폭 숫자) + "%" */
        .my-rate {
            white-space: nowrap;
        }

        .my-num {
            display: inline-block;
            width: 8ch;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .my-btn .caret {
            color: var(--muted);
            font-size: 0.6rem;
        }

        .rate-pop {
            position: absolute;
            top: calc(100% - 2px);
            left: 50%;
            z-index: 30;
            min-width: 170px;
            padding: 8px 10px;
            transform: translateX(-50%);
            background: var(--surface);
            border: 1px solid var(--accent);
            border-radius: 8px;
            box-shadow: 0 8px 24px var(--shadow);
            text-align: left;
        }

        .rate-pop-head {
            margin-bottom: 6px;
            color: var(--text-bright);
            font-size: 0.78rem;
            font-weight: 800;
            white-space: nowrap;
        }

        .rate-pop ul {
            list-style: none;
            display: grid;
            gap: 2px;
        }

        .rate-pop li button {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 3px 6px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 5px;
            color: var(--text);
            font: inherit;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .rate-pop li button:hover {
            border-color: var(--accent);
        }

        .rate-pop li.is-current button {
            color: var(--accent);
            font-weight: 800;
        }

        .rate-pop .pop-rate {
            margin-left: auto;
            font-variant-numeric: tabular-nums;
        }

        /* 인원 × 배율: 빈칸 = 0, 인원 숫자 1자리 · 배율 숫자 3자리 */
        .add-box {
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }

        .add-input {
            padding: 4px 2px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font: inherit;
            font-size: 0.82rem;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        .add-input.is-party {
            width: calc(1ch + 14px);
        }

        .add-input.is-rate {
            width: calc(4ch + 14px);
        }

        .add-input:focus,
        .champ-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .unit {
            color: var(--muted);
            font-size: 0.75rem;
        }

        .time-main {
            font-weight: 700;
            color: var(--text-bright);
            white-space: nowrap;
        }

        .time-impossible {
            font-weight: 700;
            color: var(--red);
        }

        .time-sub {
            display: block;
            margin-top: 2px;
            color: var(--muted);
            font-size: 0.7rem;
        }

        /* 저장된 API 응답을 보여 줄 때 안내 */
        .stale-note {
            margin: -4px 0 10px;
            color: var(--red);
            font-size: 0.76rem;
        }

        /* ── 도핑 선택: 머리 = 이미지 + 아래 글자, 칸 = 체크박스 / 유챔 선택 ── */
        .col-buff {
            width: 1%;
        }

        .buff-head {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .buff-head img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .buff-check {
            width: 17px;
            height: 17px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        /* 유챔: 숫자 직접입력 (5자리까지) */
        .champ-input {
            padding: 3px 4px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font: inherit;
            font-size: 0.78rem;
        }

        .champ-input {
            width: 5.2em;
            text-align: right;
        }

        /* ── 전체 요약 카드 ── */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
        }

        .summary-card {
            padding: 14px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            text-align: left;
            font: inherit;
            color: var(--text);
            cursor: pointer;
        }

        .summary-card:hover {
            border-color: var(--accent);
        }

        .sc-head {
            display: flex;
            align-items: baseline;
            gap: 6px;
            margin-bottom: 4px;
        }

        .sc-level {
            color: var(--accent);
            font-size: 0.78rem;
            font-weight: 700;
        }

        .sc-name {
            color: var(--text-bright);
            font-size: 1.05rem;
            font-weight: 900;
        }

        .sc-job {
            color: var(--muted);
            font-size: 0.78rem;
        }

        .sc-row {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
            font-size: 0.8rem;
        }

        .sc-row strong {
            color: var(--text-bright);
        }

        .progress {
            height: 6px;
            margin-top: 8px;
            border-radius: 999px;
            background: var(--surface);
            overflow: hidden;
        }

        .progress span {
            display: block;
            height: 100%;
            background: var(--green);
        }

        /* ── 설정 · 백업 ── */
        .set-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
        }

        .set-row:last-child {
            border-bottom: 0;
        }

        .set-row label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
        }

        .set-input {
            width: 4.5em;
            padding: 3px 6px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font: inherit;
            text-align: center;
        }

        .set-desc {
            width: 100%;
            color: var(--muted);
            font-size: 0.76rem;
            line-height: 1.6;
        }

        /* ── 붙여넣기 칸 · 알림 ── */
        .paste-input {
            width: 100%;
            min-height: 220px;
            margin-top: 10px;
            padding: 8px 10px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font: inherit;
            font-size: 0.78rem;
            resize: vertical;
        }

        .paste-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            z-index: 60;
            max-width: 90vw;
            padding: 10px 16px;
            transform: translateX(-50%);
            background: var(--surface);
            border: 1px solid var(--accent);
            border-radius: 10px;
            box-shadow: 0 6px 20px var(--shadow);
            color: var(--text-bright);
            font-size: 0.85rem;
            white-space: pre-line;
        }
    </style>
</head>

<body>
    <!-- 상단 고정 헤더 (scheduler.html과 같은 형식): 왼쪽 돌아가기, 오른쪽 테마 + API 키 등록 + 펼침 박스 -->
    <header class="site-header">
        <a class="back-link" href="scheduler.html">← 스케줄러</a>
        <div class="key-corner">
            <div class="corner-row">
                <button type="button" class="top-btn" id="btnTheme"></button>
                <button type="button" class="top-btn" id="btnApiKey" aria-controls="apiKeyBox" aria-expanded="false">
                    API 키 등록 <span class="top-btn-state"></span>
                </button>
            </div>
            <section id="apiKeyBox" hidden></section>
        </div>
    </header>

    <div class="bc-wrap">
        <!-- 상단 메뉴: [전체 요약] [프로파일 탭들] ······ [붙여넣기] [백업] [설정] -->
        <nav class="bc-menu" id="menu" aria-label="메뉴"></nav>

        <main id="view"></main>
    </div>

    <input type="file" id="backupInput" accept=".json,application/json" hidden>
    <div class="toast" id="toast" role="status" hidden></div>

    <!-- 순서 중요: 공통 → 저장 → API → UI -->
    <script src="js/util.js"></script>
    <script src="js/store.js"></script>
    <script src="js/api_key.js"></script>
    <script src="js/nexon_api.js"></script>
    <script src="js/scheduler_state.js"></script>
    <script src="js/difficulty.js"></script>
    <script src="js/api_key_box.js"></script>
    <!-- 이전 버전(LZ 압축 저장) 데이터를 한 번 옮길 때만 사용 -->
    <script src="js/lz-string.js"></script>
    <script>
        (function () {
            'use strict';

            /* ════════════════ 상수 ════════════════ */

            // 저장: scheduler와 같은 Store(js/store.js, 'maple_util_sched_' 접두어) · 압축/암호화 없이 JSON 그대로
            const STORE_NAME = 'boss_check';
            const API_CACHE_NAME = 'boss_check_api'; // 마지막 API 응답 (백업 파일에는 넣지 않음)
            const LEGACY_LZ_KEY = 'maple_util_boss_check'; // v1 (LZ-string 압축) 저장 키 → 처음 열 때 옮기고 삭제
            const VERSION = 3;

            const PARTY_DIGITS = 1;           // 인원 입력칸 숫자 자리수
            const RATE_DIGITS = 4;            // 배율 입력칸 숫자 자리수
            const MIN_RATE = 10;              // 내 배율 + 인원 × 배율이 이 값 미만이면 "불가"
            const DEFAULT_BASE_MINUTES = 20;  // 배율 100%일 때 걸리는 시간(분), 환산시간.user.js 기본값과 같음
            const REFRESH_MS = 5 * 60 * 1000; // 탭을 다시 볼 때 이 시간이 지났으면 API 다시 조회

            // 보스 스케줄에 보여 줄 API 보스 주기
            const CYCLES = ['bossMonthly', 'bossWeekly'];

            // 보스 스케줄 표시 순서 (data/boss_order.csv의 보스 열, API 보스 이름 기준)
            //  표에 없는 보스는 맨 뒤, 클리어한 보스는 순서와 관계없이 아래로
            const BOSS_ORDER = [
                '유피테르',
                '찬란한 흉성',
                '최초의 대적자',
                '발드릭스',
                '림보',
                '벨로나',
                '카링',
                '감시자 칼로스',
                '선택받은 세렌',
                '검은 마법사',
                '듄켈',
                '진 힐라',
                '루시드',
                '더스크',
                '윌',
                '가디언 엔젤 슬라임',
                '데미안',
                '스우',
                '매그너스',
                '피에르',
                '벨룸',
                '블러디퀸',
                '반반',
                '파풀라투스',
                '자쿰',
            ];

            // 환산(maplescouter) 효율·보스컷 [전체 보기]의 보스 출력 순서 (data/scouter_boss_order.csv)
            //  [구분, 난이도, 보스] / 구분이 있는 항목(데스티니 · 유챔)은 붙여넣기에서 건너뜀

                ['감시자 칼로스', '익스트림', '칼로스', '익스트림'],
                ['최초의 대적자', '익스트림', '대적자', '익스트림'],

                ['검은 마법사', '익스트림', '검은마법사', '익스트림'],
            ];
            const CHAMP_MAX_DIGITS = 5;

            const esc = Util.esc;

            /* ════════════════ 붙여넣기 읽기 ════════════════ */
            // 환산 효율·보스컷 페이지 [전체 보기]에서 Ctrl+A → Ctrl+C 한 텍스트 (data/copy_%_smaple.txt)
            //  - 캐릭: "Lv.295 뇌사린/렌" 줄 → 레벨 / 이름 / 직업
            //  - 보스: "boss" 줄마다 1개, 그 뒤 첫 "xx%" 또는 "[파티] xx%" 줄이 배율
            //  - n번째 boss = SCOUTER_ORDER n번째 보스 (보스 이름은 텍스트에 없음)

            const PASTE_RATE = /^(?:\[파티\]\s*)?([\d,.]+)\s*%$/;

            // → { info: { level, name, job }, bosses: { '이름|난이도': { csvRate } } }
            function parsePaste(text) {
                const lines = String(text || '').split(/\r?\n/).map((l) => l.trim());
                const info = { level: null, name: '', job: '' };
                for (const l of lines) {
                    const m = l.match(/^Lv\.(\d+)\s+(.+?)\/(.*)$/);
                    if (m) {
                        info.level = Number(m[1]);
                        info.name = m[2].trim();
                        info.job = m[3].trim();
                        break;
                    }
                }
                const rates = [];
                lines.forEach((l, i) => {
                    if (l !== 'boss') return;
                    let rate = null;
                    for (let j = i + 1; j < lines.length && lines[j] !== 'boss'; j++) {
                        const m = lines[j].match(PASTE_RATE);
                        if (m) {
                            rate = parseFloat(m[1].replace(/,/g, ''));
                            break;
                        }
                    }
                    rates.push(rate);
                });
                if (!rates.length) throw new Error('보스 목록을 찾지 못했습니다. 효율·보스컷 [전체 보기] 화면에서 복사하세요.');
                if (rates.length !== SCOUTER_ORDER.length) {
                    throw new Error(`보스 수가 순서표와 다릅니다 (붙여넣기 ${rates.length}개, 순서표 ${SCOUTER_ORDER.length}개). [전체 보기]에서 복사했는지 확인하세요.`);
                }
                const bosses = {};
                SCOUTER_ORDER.forEach(([kind, difficulty, name], i) => {
                    if (kind || rates[i] == null) return;
                    bosses[name + '|' + difficulty] = { csvRate: rates[i] };
                });
                return { info, bosses };
            }

            /* ════════════════ 보스 키 ════════════════ */

            const noSpace = (s) => String(s || '').replace(/\s/g, '');

            function splitKey(key) {
                const i = key.lastIndexOf('|');
                return { name: key.slice(0, i), difficulty: key.slice(i + 1) };
            }

            // 비교용 난이도 키: 한글·영문, 노멀·노말 모두 같은 값 (js/difficulty.js) / 모르는 값은 공백 제거 소문자
            function diffKey(difficulty) {
                return Difficulty.key(difficulty) || noSpace(difficulty).toLowerCase();
            }

            // 비교용 보스 이름: 공백 제거 + 앞에 붙은 난이도 글자 제거 (예: "하드 스우" → "스우")
            function nameKey(name) {
                const words = String(name || '').trim().split(/\s+/);
                while (words.length > 1 && Difficulty.key(words[0])) words.shift();
                return noSpace(words.join(''));
            }


            /* ════════════════ 저장 (localStorage, Store 공용) ════════════════ */
            // profile.rows: 보스 스케줄 행마다 사용자가 바꾼 값 { [행 키]: { myKey, addParty, addRate, buff } }
            //  - myKey: 내 배율로 고른 CSV 보스 키 (null = 행의 CSV 키), addParty · addRate: 인원 × 배율 (빈칸·0 = null)
            //  - 행 키 = CSV 보스 키(이름|난이도), CSV에 없는 보스는 'api:' + API 이름|난이도
            //  - 클리어 여부는 저장하지 않음 (매번 API에서 가져옴)

            function defaultState() {
                return {
                    version: VERSION,
                    settings: { baseMinutes: DEFAULT_BASE_MINUTES },
                    activeProfile: null,
                    profiles: {},
                };
            }

            // 숫자 입력칸 값: 숫자만, digits자리까지, 빈칸·0은 null
            function clampDigits(value, digits) {
                const n = parseInt(String(value ?? '').replace(/\D/g, '').slice(0, digits), 10);
                return Number.isFinite(n) && n > 0 ? n : null;
            }

            // 유챔: 0 이상 정수, 최대 5자리
            function clampChamp(value) {
                const n = parseInt(String(value).replace(/\D/g, '').slice(0, CHAMP_MAX_DIGITS), 10);
                return Number.isFinite(n) ? n : 0;
            }

            function normalizeBuff(b) {
                b = b && typeof b === 'object' ? b : {};
                const champ = clampChamp(b.champ || 0);
                return {
                    spread: !!b.spread,
                    champ,
                    collector: !!b.collector,
                    seiram: !!b.seiram,
                };
            }

            // 이전 값(manualRate · party)은 버림
            function normalizeRow(r) {
                r = r && typeof r === 'object' ? r : {};
                return {
                    myKey: typeof r.myKey === 'string' && r.myKey ? r.myKey : null,
                    addParty: clampDigits(r.addParty, PARTY_DIGITS),
                    addRate: clampDigits(r.addRate, RATE_DIGITS),
                    buff: normalizeBuff(r.buff),
                };
            }

            // 저장 데이터 · 백업 파일을 현재 구조로 맞춤 (version 올릴 때 이곳에 변환 추가)
            //  - v1/v2 → v3: selected[] (직접 고른 보스)의 직접입력 배율 · 인원을 rows로 옮김, 클리어 비트는 버림 (API로 판단)
            function normalizeState(data) {
                const base = defaultState();
                if (!data || typeof data !== 'object') return base;

                const state = {
                    version: VERSION,
                    settings: { baseMinutes: DEFAULT_BASE_MINUTES },
                    activeProfile: data.activeProfile || null,
                    profiles: {},
                };
                const minutes = parseFloat(data.settings && data.settings.baseMinutes);
                if (minutes > 0) state.settings.baseMinutes = minutes;

                const profiles = data.profiles && typeof data.profiles === 'object' ? data.profiles : {};
                for (const [key, p] of Object.entries(profiles)) {
                    if (!p || typeof p !== 'object') continue;
                    const bosses = {};
                    for (const [bk, b] of Object.entries(p.bosses || {})) {
                        bosses[bk] = { csvRate: b && Number.isFinite(b.csvRate) ? b.csvRate : null };
                    }
                    const rows = {};
                    for (const s of Array.isArray(p.selected) ? p.selected : []) {
                        if (s && s.key) rows[s.key] = normalizeRow(s);
                    }
                    for (const [rk, r] of Object.entries(p.rows || {})) rows[rk] = normalizeRow(r);
                    state.profiles[key] = {
                        level: Number.isFinite(p.level) ? p.level : null,
                        name: key,
                        job: p.job || '',
                        csvName: p.csvName || key,
                        ocid: typeof p.ocid === 'string' && p.ocid ? p.ocid : null,
                        bosses,
                        rows,
                    };
                }
                if (!state.profiles[state.activeProfile]) {
                    state.activeProfile = Object.keys(state.profiles)[0] || null;
                }
                return state;
            }

            // v1(LZ 압축) 저장값 읽기: 없거나 읽지 못하면 null
            function loadLegacy() {
                try {
                    const raw = localStorage.getItem(LEGACY_LZ_KEY);
                    if (!raw || !window.LZString) return null;
                    return JSON.parse(LZString.decompressFromUTF16(raw));
                } catch (e) {
                    console.warn('[보스 체크] 이전 저장 데이터 읽기 실패', e);
                    return null;
                }
            }

            function loadState() {
                const saved = Store.load(STORE_NAME, null);
                if (saved) return normalizeState(saved);
                const legacy = loadLegacy();
                if (!legacy) return defaultState();
                // 이전 데이터를 새 저장소로 옮긴 뒤 이전 키 삭제
                const migrated = normalizeState(legacy);
                if (Store.save(STORE_NAME, migrated)) {
                    try { localStorage.removeItem(LEGACY_LZ_KEY); } catch (e) { }
                }
                return migrated;
            }

            // 붙여넣은 원본 텍스트는 저장하지 않고 파싱 결과(state)만 저장
            function saveState() {
                if (!Store.save(STORE_NAME, state)) {
                    toast('저장에 실패했습니다 (저장 공간 부족 또는 사생활 보호 모드)');
                }
            }

            /* ════════════════ 배율 → 예상시간 ════════════════ */

            // 적용 배율 = 내 배율 + 인원 × 배율 (빈칸은 0, 모두 비면 null)
            function adjustedRate(myRate, party, rate) {
                const add = (party || 0) * (rate || 0);
                if (myRate == null && !add) return null;
                return (myRate || 0) + add;
            }

            // 환산시간.user.js 계산식: 클리어 시간 = 기준 시간 ÷ (배율 ÷ 100)
            function estimateSeconds(rate, baseMinutes) {
                return (baseMinutes * 60) / (rate / 100);
            }

            // 환산시간.user.js와 같은 표기: "1시간 40분" / "55분 33초"
            function formatTime(totalSeconds) {
                const s = Math.round(totalSeconds);
                const h = Math.floor(s / 3600);
                const m = Math.floor((s % 3600) / 60);
                const sec = s % 60;
                if (h > 0) return `${h}시간 ${m}분`;
                return `${m}분 ${String(sec).padStart(2, '0')}초`;
            }

            function fmtRate(value) {
                if (value == null) return '-';
                return String(Math.round(value * 100) / 100);
            }

            /* ════════════════ 상태 ════════════════ */

            let state = loadState();

            const ui = {
                view: state.activeProfile ? 'profile' : 'summary', // summary | profile | backup | settings
            };

            // API 조회 결과 (저장하지 않음): { [프로파일 이름]: { status, msg, bosses, at } }
            //  - status: loading | ok | error | nokey
            const live = {};
            let lastLoad = 0;

            function activeProfile() {
                return state.profiles[state.activeProfile] || null;
            }

            // 버튼 · 입력칸이 속한 프로파일 (data-profile 박스 기준)
            function profileOf(el) {
                const box = el.closest('[data-profile]');
                return box ? state.profiles[box.dataset.profile] || null : null;
            }

            // 행 설정 (없으면 기본값으로 만들어 둠)
            function rowConf(profile, rowKey) {
                if (!profile.rows[rowKey]) profile.rows[rowKey] = normalizeRow(null);
                return profile.rows[rowKey];
            }

            /* ════════════════ 넥슨 API: 보스 스케줄 · 클리어 ════════════════ */
            // API 키 · 호출은 scheduler.html과 공용 (js/api_key.js, js/nexon_api.js, js/scheduler_state.js)
            //  - 캐릭 찾기: 계정 캐릭터 목록에서 프로파일 이름(또는 처음 불러온 이름)과 같은 캐릭 → ocid 저장
            //  - 인게임 스케줄러에 등록된 월간 · 주간 보스 = 보스 스케줄, complete_flag = 클리어

            async function fetchCharacterList() {
                const body = await NexonApi.get('/maplestory/v1/character/list');
                const list = [];
                ((body && body.account_list) || []).forEach((acc) => {
                    (acc.character_list || []).forEach((c) => list.push(c));
                });
                return list;
            }

            /* ── API ↔ CSV 보스 매핑 ── */
            // { 'API이름(공백 제거)|난이도(노멀→노말)': 'CSV보스이름|CSV난이도' 또는 null(CSV에 없는 보스) }
            const bossMap = {};
            BOSS_MAPPING.forEach(([apiName, apiDiff, csvName, csvDiff]) => {
                bossMap[nameKey(apiName) + '|' + diffKey(apiDiff)] = csvName ? csvName + '|' + csvDiff : null;
            });

            // API 보스 → CSV 보스 키 (배율 기본값을 가져올 CSV 행)
            //  1) 매핑표: API 이름·난이도로 찾은 CSV 보스가 프로파일 CSV에 있으면 그것
            //  2) 매핑표에 없으면: 난이도가 같고 API 이름에 CSV 이름이 들어 있는(또는 반대) 것 중 가장 긴 이름
            //     예) API "찬란한 흉성" ↔ CSV "흉성", API "검은 마법사" ↔ CSV "검은마법사"
            //  난이도는 diffKey(한글/영문·노멀/노말 무시), 이름은 nameKey(공백·앞 난이도 글자 무시)로 비교
            function csvKeyOf(profile, apiBoss) {
                const apiName = nameKey(apiBoss.content_name);
                const diff = diffKey(apiBoss.difficulty);
                const mapKey = apiName + '|' + diff;
                if (mapKey in bossMap) {
                    const mapped = bossMap[mapKey];
                    if (!mapped) return null;
                    const m = splitKey(mapped);
                    const found = Object.keys(profile.bosses).find((key) => {
                        const k = splitKey(key);
                        return nameKey(k.name) === nameKey(m.name) && diffKey(k.difficulty) === diffKey(m.difficulty);
                    });
                    if (found) return found;
                }
                let best = null;
                for (const key of Object.keys(profile.bosses)) {
                    const k = splitKey(key);
                    if (diffKey(k.difficulty) !== diff) continue;
                    const n = nameKey(k.name);
                    if (n && (apiName.includes(n) || n.includes(apiName)) && (!best || n.length > nameKey(splitKey(best).name).length)) best = key;
                }
                return best;
            }

            // 보스 순서 (BOSS_ORDER 위치, 없으면 맨 뒤)
            const bossOrderIndex = (() => {
                const idx = new Map(BOSS_ORDER.map((n, i) => [nameKey(n), i]));
                return (name) => (idx.has(nameKey(name)) ? idx.get(nameKey(name)) : BOSS_ORDER.length);
            })();

            // 보스 스케줄 행 목록: 미클리어 → 클리어, 각각 BOSS_ORDER 순 (같으면 인게임 스케줄러 순서)
            function scheduleRows(profile) {
                const info = live[profile.name];
                if (!info || info.status !== 'ok') return [];
                const done = (b) => (SchedulerState.flag(b.complete_flag) ? 1 : 0);
                return info.bosses
                    .filter((b) => CYCLES.includes(b.cycle) && SchedulerState.flag(b.registration_flag))
                    .sort((a, b) => done(a) - done(b)
                        || bossOrderIndex(a.content_name) - bossOrderIndex(b.content_name)
                        || (Number(a.list_order_no) || 0) - (Number(b.list_order_no) || 0))
                    .map((b) => {
                        const csvKey = csvKeyOf(profile, b);
                        const rowKey = csvKey || `api:${nameKey(b.content_name)}|${diffKey(b.difficulty)}`;
                        return {
                            rowKey,
                            csvKey,
                            name: b.content_name,
                            difficulty: b.difficulty,
                            monthly: b.cycle === 'bossMonthly',
                            done: SchedulerState.flag(b.complete_flag),
                        };
                    });
            }

            /* ── API 응답 저장: { [프로파일 이름]: { bosses, level, at } } ── */
            //  API 키가 없거나 호출이 실패하면 마지막으로 받은 응답으로 보스 스케줄 · 클리어를 보여 줌
            const apiCache = Store.load(API_CACHE_NAME, {}) || {};

            function saveApiCache() {
                Store.save(API_CACHE_NAME, apiCache);
            }

            // 보스 스케줄에 쓰는 필드만 저장
            function slimBoss(b) {
                return {
                    content_name: b.content_name,
                    difficulty: b.difficulty,
                    cycle: b.cycle,
                    registration_flag: b.registration_flag,
                    complete_flag: b.complete_flag,
                    list_order_no: b.list_order_no,
                };
            }

            // 저장된 응답이 있으면 그것으로 표시 (stale = 실패 이유), 없으면 fail 그대로
            function useCache(p, fail) {
                const c = apiCache[p.name];
                live[p.name] = c && Array.isArray(c.bosses)
                    ? { status: 'ok', bosses: c.bosses, at: c.at, stale: fail.msg || '' }
                    : fail;
            }

            async function loadProfile(p, getChars) {
                live[p.name] = { status: 'loading', bosses: [] };
                try {
                    if (!p.ocid) {
                        const c = (await getChars()).find((x) => x.character_name === p.name || x.character_name === p.csvName);
                        if (!c) {
                            useCache(p, { status: 'error', msg: '계정에서 같은 이름의 캐릭터를 찾지 못했습니다', bosses: [] });
                            return;
                        }
                        p.ocid = c.ocid;
                    }
                    const data = await SchedulerState.fetch(p.ocid);
                    if (Number(data.character_level)) p.level = Number(data.character_level);
                    const bosses = (data.boss_contents || []).map(slimBoss);
                    live[p.name] = { status: 'ok', bosses, at: Date.now() };
                    apiCache[p.name] = { bosses, level: p.level, at: Date.now() };
                    saveApiCache();
                } catch (e) {
                    if (e.status === 400) p.ocid = null; // 잘못된 ocid → 다음에 다시 찾기
                    useCache(p, { status: 'error', msg: e.message, bosses: [] });
                }
            }

            // 모든 프로파일 조회 (순서대로, 끝날 때마다 화면 갱신)
            let loading = false;
            async function loadAll() {
                const profiles = Object.values(state.profiles);
                if (loading || !profiles.length) return;
                if (!ApiKey.has()) {
                    profiles.forEach((p) => useCache(p, { status: 'nokey', msg: 'API 키 없음', bosses: [] }));
                    render();
                    return;
                }
                loading = true;
                lastLoad = Date.now();
                profiles.forEach((p) => { live[p.name] = { status: 'loading', bosses: [] }; });
                render();
                let chars = null;
                const getChars = async () => (chars = chars || await fetchCharacterList());
                for (const p of profiles) {
                    await loadProfile(p, getChars);
                    render();
                }
                loading = false;
                saveState(); // ocid · 레벨 저장
            }

            /* ════════════════ 행 계산 ════════════════ */

            function csvRateOf(profile, key) {
                const b = key && profile.bosses[key];
                return b ? b.csvRate : null;
            }

            // 내 배율 CSV 키 = 고른 난이도 ?? 행의 CSV 키
            function myKeyOf(profile, row, conf) {
                return conf.myKey && profile.bosses[conf.myKey] ? conf.myKey : row.csvKey;
            }

            // { adj: 내 배율 + 인원 × 배율, seconds: 예상 초 (불가면 null) }
            function rowEstimate(profile, row, conf) {
                const adj = adjustedRate(csvRateOf(profile, myKeyOf(profile, row, conf)), conf.addParty, conf.addRate);
                if (adj == null || adj < MIN_RATE) return { adj, seconds: null };
                return { adj, seconds: estimateSeconds(adj, state.settings.baseMinutes) };
            }

            function profileStats(profile) {
                let cleared = 0;
                let total = 0;
                let remain = 0;
                let impossible = 0;
                const rows = scheduleRows(profile);
                for (const row of rows) {
                    if (row.done) cleared++;
                    const { seconds } = rowEstimate(profile, row, profile.rows[row.rowKey] || normalizeRow(null));
                    if (seconds == null) {
                        impossible++;
                        continue;
                    }
                    total += seconds;
                    if (!row.done) remain += seconds;
                }
                return { cleared, count: rows.length, total, remain, impossible };
            }

            /* ════════════════ 붙여넣기 불러오기 (병합) ════════════════ */

            // 같은 캐릭: 프로파일 키 또는 처음 불러온 이름(csvName)이 같으면 같은 캐릭으로 봄 (이름 변경 후에도 병합)
            function findProfileKey(name) {
                if (state.profiles[name]) return name;
                return Object.keys(state.profiles).find((k) => state.profiles[k].csvName === name) || null;
            }

            // 성공하면 true
            function importPaste(text) {
                let parsed;
                try {
                    parsed = parsePaste(text);
                } catch (e) {
                    toast('붙여넣기 실패: ' + e.message);
                    return false;
                }
                const { info, bosses } = parsed;
                if (!info.name) {
                    const input = prompt('캐릭터 이름을 찾지 못했습니다. 프로파일 이름을 입력하세요.', '');
                    if (!input || !input.trim()) return false;
                    info.name = input.trim();
                }
                const key = findProfileKey(info.name);
                let added = false;
                if (key) {
                    // 병합: 배율 · 레벨 · 직업만 갱신 (내 배율 선택 · 인원 · 도핑 유지)
                    const p = state.profiles[key];
                    if (info.level != null) p.level = info.level;
                    if (info.job) p.job = info.job;
                    for (const [bk, b] of Object.entries(bosses)) {
                        p.bosses[bk] = Object.assign({}, p.bosses[bk], { csvRate: b.csvRate });
                    }
                    state.activeProfile = key;
                } else {
                    state.profiles[info.name] = {
                        level: info.level,
                        name: info.name,
                        job: info.job,
                        csvName: info.name,
                        ocid: null,
                        bosses,
                        rows: {},
                    };
                    state.activeProfile = info.name;
                    added = true;
                }
                ui.view = 'profile';
                saveState();
                render();
                if (added) loadAll(); // 새 프로파일의 보스 스케줄 가져오기
                toast(`붙여넣기: ${state.activeProfile} ${added ? '새 프로파일' : '배율 갱신'} (보스 ${Object.keys(bosses).length}개)`);
                return true;
            }

            /* ════════════════ 프로파일 관리 ════════════════ */

            function renameProfile(p) {
                if (!p) return;
                const input = prompt('새 프로파일 이름', p.name);
                if (input == null) return;
                const next = input.trim();
                if (!next || next === p.name) return;
                if (state.profiles[next]) {
                    alert(`'${next}' 프로파일이 이미 있습니다.`);
                    return;
                }
                // 탭 순서를 유지하며 키 변경
                const old = p.name;
                const profiles = {};
                for (const [k, v] of Object.entries(state.profiles)) {
                    if (k === old) {
                        v.name = next;
                        profiles[next] = v;
                    } else {
                        profiles[k] = v;
                    }
                }
                state.profiles = profiles;
                live[next] = live[old];
                delete live[old];
                if (apiCache[old]) {
                    apiCache[next] = apiCache[old];
                    delete apiCache[old];
                    saveApiCache();
                }
                if (state.activeProfile === old) state.activeProfile = next;
                saveState();
                render();
            }

            function deleteProfile(p) {
                if (!p) return;
                if (!confirm(`'${p.name}' 프로파일을 삭제할까요?\nCSV 배율 · 직접입력 배율 · 인원 · 도핑 설정이 모두 지워지며 되돌릴 수 없습니다.`)) return;
                delete state.profiles[p.name];
                delete live[p.name];
                if (apiCache[p.name]) {
                    delete apiCache[p.name];
                    saveApiCache();
                }
                if (!state.profiles[state.activeProfile]) state.activeProfile = Object.keys(state.profiles)[0] || null;
                if (!state.activeProfile) ui.view = 'summary';
                saveState();
                render();
            }

            /* ════════════════ 백업 ════════════════ */

            function downloadFile(fileName, text, type) {
                const url = URL.createObjectURL(new Blob([text], { type }));
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            }

            function exportBackup() {
                const d = new Date();
                const stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
                downloadFile(`boss_check_backup_${stamp}.json`, JSON.stringify(state, null, 2), 'application/json');
            }

            async function importBackup(file) {
                let data;
                try {
                    data = JSON.parse((await file.text()).replace(/^﻿/, ''));
                } catch (e) {
                    alert('JSON 파일을 읽지 못했습니다.');
                    return;
                }
                if (!data || typeof data !== 'object' || typeof data.profiles !== 'object') {
                    alert('보스 체크 백업 파일이 아닙니다.');
                    return;
                }
                const count = Object.keys(data.profiles || {}).length;
                if (!confirm(`백업 데이터(프로파일 ${count}개)로 현재 데이터를 덮어씁니다.\n현재 데이터는 사라집니다. 계속할까요?`)) return;
                state = normalizeState(data);
                Object.keys(live).forEach((k) => delete live[k]);
                ui.view = state.activeProfile ? 'profile' : 'summary';
                saveState();
                render();
                toast('백업을 불러왔습니다');
                loadAll();
            }

            /* ════════════════ 화면: 공통 ════════════════ */

            const $menu = document.getElementById('menu');
            const $view = document.getElementById('view');
            const $toast = document.getElementById('toast');
            let toastTimer = null;

            function toast(message) {
                $toast.textContent = message;
                $toast.hidden = false;
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => { $toast.hidden = true; }, 3500);
            }

            // 난이도 이미지: img/difficulty (js/difficulty.js, 스케줄러와 공용 · API 한글/영문 값 모두)
            function difficultyBadge(difficulty) {
                return Difficulty.badge(difficulty);
            }

            function diffRank(difficulty) {
                const i = DIFFICULTY_ORDER.indexOf(difficulty);
                return i < 0 ? DIFFICULTY_ORDER.length : i;
            }

            // CSV에서 같은 보스의 난이도 목록 (어려운 순): [{ difficulty, key, rate }]
            function bossDiffs(profile, name) {
                const n = nameKey(name);
                // API 이름이면 매핑표의 CSV 이름으로도 찾음 (예: 선택받은 세렌 → 세렌)
                const mappedKey = Object.keys(bossMap).find((k) => k.startsWith(n + '|') && bossMap[k]);
                const alt = mappedKey ? nameKey(splitKey(bossMap[mappedKey]).name) : n;
                const diffs = [];
                for (const [key, b] of Object.entries(profile.bosses)) {
                    const k = splitKey(key);
                    if (nameKey(k.name) === n || nameKey(k.name) === alt) diffs.push({ difficulty: k.difficulty, key, rate: b.csvRate });
                }
                return diffs.sort((a, b) => diffRank(a.difficulty) - diffRank(b.difficulty));
            }

            function render() {
                renderMenu();
                if (ui.view === 'profile' && activeProfile()) renderProfile();
                else if (ui.view === 'paste') renderPaste();
                else if (ui.view === 'backup') renderBackup();
                else if (ui.view === 'settings') renderSettings();
                else {
                    ui.view = 'summary';
                    renderSummary();
                }
            }

            function renderMenu() {
                const btn = (active, attrs, text, extra) =>
                    `<button type="button" class="top-btn${extra || ''}${active ? ' is-active' : ''}" ${attrs}>${text}</button>`;
                const tabs = Object.keys(state.profiles).map((name) =>
                    btn(ui.view === 'profile' && name === state.activeProfile, `data-act="tab" data-name="${esc(name)}"`, esc(name))
                ).join('');
                $menu.innerHTML = btn(ui.view === 'summary', 'data-act="view" data-view="summary"', '전체 요약')
                    + `<div class="bc-tabs">${tabs}</div>`
                    + '<span class="menu-sep"></span>'
                    + btn(ui.view === 'paste', 'data-act="view" data-view="paste"', '붙여넣기', ' is-primary')
                    + btn(ui.view === 'backup', 'data-act="view" data-view="backup"', '백업')
                    + btn(ui.view === 'settings', 'data-act="view" data-view="settings"', '설정');
            }

            /* ── 프로파일 머리 (캐릭 정보 + 이름 변경 · 삭제) ── */

            function profileHeadHtml(p) {
                return `
                    <div class="ph">
                        <div class="ph-info">
                            ${p.level != null ? `<span class="ph-level">Lv.${p.level}</span>` : ''}
                            <span class="ph-name">${esc(p.name)}</span>
                            <span class="ph-job">${esc(p.job)}</span>
                        </div>
                        <div class="ph-actions">
                            <button type="button" class="btn btn-sm" data-act="rename">이름 변경</button>
                            <button type="button" class="btn btn-sm is-danger" data-act="delete">삭제</button>
                        </div>
                    </div>`;
            }

            /* ── 보스 스케줄 (제목 + 표) : 프로파일 화면 · 전체 요약 공용 ── */
            // (클리어) | 난이도 | 보스 | 내 배율 + 인원 × 배율 = 예상시간 | 뿌리기 | 유챔 | 콜렉터 | 세이람

            // 내 배율 목록: 고르면 그 난이도의 csv 배율 사용 (저장)
            function detailPopHtml(p, row, myKey) {
                const diffs = bossDiffs(p, row.csvKey ? splitKey(row.csvKey).name : row.name);
                const list = diffs.length
                    ? `<ul>${diffs.map((d) => `
                        <li class="${d.key === myKey ? 'is-current' : ''}">
                            <button type="button" data-act="my-pick" data-key="${esc(d.key)}">
                                ${difficultyBadge(d.difficulty)}
                                <span class="pop-rate">${fmtRate2(d.rate)}%</span>
                            </button>
                        </li>`).join('')}</ul>`
                    : '<p class="muted">CSV에서 이 보스를 찾지 못했습니다</p>';
                const unmatched = row.csvKey ? '' : `<p class="muted">CSV와 연결되지 않음 · API 값: ${esc(row.name)} / ${esc(row.difficulty)}</p>`;
                return `
                    <div class="rate-pop" hidden>
                        <div class="rate-pop-head">${esc(row.name)} 내 배율 선택</div>
                        ${list}
                        ${unmatched}
                    </div>`;
            }

            // 유챔: 숫자 직접입력 칸 (숫자만, 5자리까지, 0이면 빈칸)
            function champHtml(conf) {
                const n = conf.buff.champ;
                return `<input class="champ-input" type="text" inputmode="numeric" maxlength="${CHAMP_MAX_DIGITS}" data-act="champ-num"
                    value="${n ? n : ''}" placeholder="0" aria-label="유챔 (숫자 ${CHAMP_MAX_DIGITS}자리까지)">`;
            }

            function buffCellsHtml(conf) {
                return BUFFS.map((f) => f.kind === 'champ'
                    ? `<td class="col-buff">${champHtml(conf)}</td>`
                    : `<td class="col-buff"><input class="buff-check" type="checkbox" data-act="buff" data-buff="${f.id}"
                        ${conf.buff[f.id] ? 'checked' : ''} aria-label="${esc(f.label)}"></td>`
                ).join('');
            }

            function buffHeadHtml() {
                return BUFFS.map((f) => `
                    <th class="col-buff">
                        <span class="buff-head">
                            <img src="${BUFF_DIR}${esc(f.img)}" alt="" onerror="this.remove()">
                            <span>${esc(f.label)}</span>
                        </span>
                    </th>`).join('');
            }

            // 내 배율 표기: 소수 둘째 자리까지 항상 (10.2 → 10.20), 없으면 -
            function fmtRate2(rate) {
                return Number.isFinite(rate) ? rate.toFixed(2) : '-';
            }

            function scheduleRowHtml(p, row) {
                const conf = p.rows[row.rowKey] || normalizeRow(null);
                const myKey = myKeyOf(p, row, conf);
                const myRate = csvRateOf(p, myKey);
                const picked = myKey && myKey !== row.csvKey;
                const est = rowEstimate(p, row, conf);
                const time = est.seconds == null
                    ? '<span class="time-impossible">불가</span>'
                    : `<span class="time-main">${formatTime(est.seconds)}</span>`;
                return `
                    <tr data-row="${esc(row.rowKey)}" class="${row.done ? 'is-cleared' : ''}">
                        <td class="col-clear">
                            <input class="clear-check" type="checkbox" ${row.done ? 'checked' : ''} disabled tabindex="-1"
                                aria-label="클리어 (API)" title="${row.done ? '클리어' : '미클리어'} (인게임 스케줄러 기준)">
                        </td>
                        <td class="col-dif">${difficultyBadge(row.difficulty)}</td>
                        <td class="col-boss">
                            <span class="boss-name">${esc(row.name)}</span>${row.monthly ? '<span class="tag-monthly" title="매월 1일 초기화">월간</span>' : ''}
                        </td>
                        <td class="col-my">
                            <button type="button" class="my-btn${picked ? ' is-picked' : ''}" data-act="detail" aria-expanded="false"
                                title="누르면 난이도별 csv 배율에서 선택">
                                <span class="my-rate"><span class="my-num">${fmtRate2(myRate)}</span>%</span><span class="caret">▼</span>
                            </button>
                            ${detailPopHtml(p, row, myKey)}
                        </td>
                        <td class="col-op" aria-hidden="true">+</td>
                        <td class="col-add">
                            <span class="add-box">
                                <input class="add-input is-party" type="text" inputmode="numeric" maxlength="${PARTY_DIGITS}" data-act="add-party"
                                    value="${conf.addParty || ''}" aria-label="인원">
                                <span class="col-op" aria-hidden="true">×</span>
                                <input class="add-input is-rate" type="text" inputmode="numeric" maxlength="${RATE_DIGITS}" data-act="add-rate"
                                    value="${conf.addRate || ''}" aria-label="배율">
                                <span class="unit">%</span>
                            </span>
                        </td>
                        <td class="col-op" aria-hidden="true">=</td>
                        <td class="col-time">${time}<span class="time-sub">적용 ${est.adj == null ? '-' : fmtRate(est.adj) + '%'}</span></td>
                        ${buffCellsHtml(conf)}
                    </tr>`;
            }

            // API 상태별 안내 문구 (표 대신 표시)
            function liveMessage(p) {
                const info = live[p.name];
                if (!info || info.status === 'loading') return 'API에서 보스 스케줄을 불러오는 중…';
                if (info.status === 'nokey') return '오른쪽 위 [API 키 등록]에서 넥슨 오픈API 키를 등록하세요.';
                if (info.status === 'error') return `불러오기 실패: ${esc(info.msg || '')}`;
                return '';
            }

            function fmtDateTime(ms) {
                return ms ? new Date(ms).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' }) : '-';
            }

            function scheduleHtml(p) {
                const s = profileStats(p);
                const rows = scheduleRows(p);
                const msg = liveMessage(p);

                const info = live[p.name];
                const stale = info && info.stale !== undefined
                    ? `<p class="stale-note">API를 불러오지 못해 저장된 응답(${fmtDateTime(info.at)})을 표시합니다${info.stale ? ` · ${esc(info.stale)}` : ''}</p>`
                    : '';
                const title = (extra) => `
                    <div class="card-head sub-head">
                        <h2>보스 스케줄</h2>
                        ${msg ? '' : `<span class="counter" title="클리어 / 스케줄 보스">${s.cleared}/${s.count}</span>`}
                        ${extra || ''}
                    </div>`;

                // 표가 있으면 제목 · 합계를 표 맨 윗줄에 (합계 오른쪽 끝 = 예상시간 칸 오른쪽 끝)
                if (msg || !rows.length) {
                    return `
                        <div class="sched">
                            ${title()}
                            ${stale}
                            <div class="empty">${msg || '인게임 스케줄러에 등록된 주간 · 월간 보스가 없습니다.'}</div>
                        </div>`;
                }
                const totals = `
                    <span class="grow"></span>
                    <span class="sched-total">
                        <span>총 예상시간 <strong>${formatTime(s.total)}</strong></span>
                        <span><span title="미클리어 보스 합계">남은 시간</span> <strong>${formatTime(s.remain)}</strong></span>
                    </span>`;
                return `
                    <div class="sched">
                        ${stale}
                        <div class="table-scroll">
                            <table class="boss-table">
                                <thead>
                                    <tr class="group-row">
                                        <th colspan="8" class="sched-title">${title(totals)}</th>
                                        <th colspan="${BUFFS.length}" class="dop-head">도핑메모</th>
                                    </tr>
                                    <tr>
                                        <th>클리어</th><th>난이도</th><th>보스</th><th>내 배율</th><th class="col-op"></th><th>인원 × 배율</th><th class="col-op"></th><th>예상시간</th>
                                        ${buffHeadHtml()}
                                    </tr>
                                </thead>
                                <tbody class="boss-rows">${rows.map((row) => scheduleRowHtml(p, row)).join('')}</tbody>
                            </table>
                        </div>
                        ${s.impossible ? `<p class="muted" style="margin-top:8px">※ '불가' 보스 ${s.impossible}개는 합계에서 제외</p>` : ''}
                    </div>`;
            }

            /* ════════════════ 화면: 전체 요약 ════════════════ */

            function renderSummary() {
                const profiles = Object.values(state.profiles);
                if (!profiles.length) {
                    $view.innerHTML = `
                        <section class="bc-card">
                            <div class="empty">
                                프로파일이 없습니다.<br>
                                [붙여넣기]에서 환산 효율·보스컷 [전체 보기] 페이지를 전체 복사해 붙여넣으세요.
                            </div>
                        </section>`;
                    return;
                }
                const cards = profiles.map((p) => {
                    const s = profileStats(p);
                    const pct = s.count ? Math.round((s.cleared / s.count) * 100) : 0;
                    return `
                        <button type="button" class="summary-card" data-act="tab" data-name="${esc(p.name)}">
                            <div class="sc-head">
                                ${p.level != null ? `<span class="sc-level">Lv.${p.level}</span>` : ''}
                                <span class="sc-name">${esc(p.name)}</span>
                                <span class="sc-job">${esc(p.job)}</span>
                            </div>
                            <div class="sc-row"><span>클리어</span><strong>${s.cleared}/${s.count}</strong></div>
                            <div class="sc-row"><span>남은 예상시간</span><strong>${s.count ? formatTime(s.remain) : '-'}</strong></div>
                            <div class="progress"><span style="width:${pct}%"></span></div>
                        </button>`;
                }).join('');

                // 요약 카드 아래: 프로파일별 박스 (캐릭 정보 · 버튼 · 보스 스케줄)
                const boxes = profiles.map((p) => `
                    <section class="bc-card" data-profile="${esc(p.name)}">
                        ${profileHeadHtml(p)}
                        ${scheduleHtml(p)}
                    </section>`).join('');

                $view.innerHTML = `
                    <section class="bc-card">
                        <div class="card-head">
                            <h2>전체 요약</h2><span class="muted">카드를 누르면 해당 프로파일로 이동</span>
                        </div>
                        <div class="summary-grid">${cards}</div>
                    </section>
                    ${boxes}`;
            }

            /* ════════════════ 화면: 프로파일 ════════════════ */

            function renderProfile() {
                const p = activeProfile();
                $view.innerHTML = `
                    <section class="bc-card" data-profile="${esc(p.name)}">
                        ${profileHeadHtml(p)}
                        ${scheduleHtml(p)}
                    </section>`;
            }

            /* ════════════════ 화면: 백업 · 설정 ════════════════ */

            function renderPaste() {
                $view.innerHTML = `
                    <section class="bc-card">
                        <div class="card-head"><h2>붙여넣기</h2></div>
                        <p class="set-desc">
                            환산 효율·보스컷 페이지에서 [전체 보기]를 누른 뒤 Ctrl+A → Ctrl+C로 전체 복사해 아래에 붙여넣고 [불러오기]를 누르세요.<br>
                            보스 순서표(${SCOUTER_ORDER.length}개)대로 배율을 읽고, 데스티니 · 유챔 항목은 건너뜁니다. 같은 캐릭터면 배율만 갱신합니다.
                        </p>
                        <textarea class="paste-input" id="pasteInput" placeholder="여기에 붙여넣기 (Ctrl+V)"></textarea>
                        <div class="set-row">
                            <button type="button" class="btn is-primary" data-act="paste-import">불러오기</button>
                        </div>
                    </section>`;
            }

            function renderBackup() {
                $view.innerHTML = `
                    <section class="bc-card">
                        <div class="card-head"><h2>백업</h2></div>
                        <div class="set-row">
                            <button type="button" class="btn is-primary" data-act="backup-export">JSON 내보내기</button>
                            <span class="set-desc">모든 프로파일 · CSV 배율 · 직접입력 배율 · 인원 · 도핑 · 설정을 JSON 파일로 내려받습니다.</span>
                        </div>
                        <div class="set-row">
                            <button type="button" class="btn" data-act="backup-import">JSON 가져오기</button>
                            <span class="set-desc">백업 JSON 파일로 현재 데이터를 덮어씁니다. 덮어쓰기 전에 확인 창이 뜹니다.</span>
                        </div>
                    </section>`;
            }

            function renderSettings() {
                $view.innerHTML = `
                    <section class="bc-card">
                        <div class="card-head"><h2>설정</h2></div>
                        <div class="set-row">
                            <label>기준 시간 <input class="set-input" type="number" min="1" step="1" data-act="base-minutes" value="${state.settings.baseMinutes}"> 분</label>
                            <span class="set-desc">배율 100%일 때 걸리는 시간입니다. 예상시간 = 기준 시간 ÷ (적용 배율 ÷ 100)</span>
                        </div>
                        <div class="set-row">
                            <span class="set-desc">
                                보스 스케줄 · 클리어: 오른쪽 위 넥슨 오픈API 키(스케줄러 페이지와 공용)로 프로파일 이름과 같은 캐릭터를 찾아,
                                인게임 스케줄러에 등록된 월간 · 주간 보스와 클리어 여부를 가져옵니다. 페이지를 열 때마다 새로 가져옵니다.
                            </span>
                        </div>
                    </section>`;
            }

            /* ════════════════ 상단 헤더: 테마 · API 키 (scheduler.js와 같은 동작) ════════════════ */

            const $keyBox = document.getElementById('apiKeyBox');
            const $keyBtn = document.getElementById('btnApiKey');
            const $keyState = $keyBtn.querySelector('.top-btn-state');

            function setKeyBoxOpen(open) {
                $keyBox.hidden = !open;
                $keyBtn.setAttribute('aria-expanded', String(open));
            }

            function renderKeyState() {
                const has = ApiKey.has();
                $keyState.textContent = has ? '저장됨' : '미등록';
                $keyState.classList.toggle('is-set', has);
            }

            $keyBtn.addEventListener('click', () => setKeyBoxOpen($keyBox.hidden));

            /* ════════════════ 이벤트 ════════════════ */

            const $backupInput = document.getElementById('backupInput');

            $backupInput.addEventListener('change', () => {
                if ($backupInput.files[0]) importBackup($backupInput.files[0]);
                $backupInput.value = '';
            });

            // 행의 { profile, row 키, 설정 }
            function rowCtx(el) {
                const tr = el.closest('tr[data-row]');
                const p = profileOf(el);
                if (!tr || !p) return null;
                return { p, conf: rowConf(p, tr.dataset.row) };
            }

            function commit() {
                saveState();
                render();
            }

            function closeDetails(except) {
                $view.querySelectorAll('.rate-pop:not([hidden])').forEach((pop) => {
                    if (pop === except) return;
                    pop.hidden = true;
                    const btn = pop.parentNode.querySelector('[data-act="detail"]');
                    if (btn) btn.setAttribute('aria-expanded', 'false');
                });
            }

            // 메뉴 · 요약 카드 클릭
            function onMenuClick(e) {
                const btn = e.target.closest('[data-act]');
                if (!btn) return;
                const act = btn.dataset.act;
                if (act === 'tab') {
                    state.activeProfile = btn.dataset.name;
                    ui.view = 'profile';
                    commit();
                    window.scrollTo(0, 0);
                } else if (act === 'view') {
                    ui.view = btn.dataset.view;
                    render();
                }
            }

            $menu.addEventListener('click', onMenuClick);

            // 바깥 클릭: [상세] 팝업 닫기, (키가 저장된 경우) API 키 박스 닫기
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.rate-pop, [data-act="detail"]')) closeDetails(null);
                if (!$keyBox.hidden && ApiKey.has() && !e.target.closest('.key-corner')) setKeyBoxOpen(false);
            });

            $view.addEventListener('click', (e) => {
                const el = e.target.closest('[data-act]');
                if (!el) return;
                const act = el.dataset.act;
                const p = profileOf(el);

                if (act === 'tab') return onMenuClick(e);
                if (act === 'rename') return renameProfile(p);
                if (act === 'delete') return deleteProfile(p);
                if (act === 'backup-export') return exportBackup();
                if (act === 'backup-import') return $backupInput.click();
                if (act === 'paste-import') {
                    const $in = document.getElementById('pasteInput');
                    if ($in && importPaste($in.value)) $in.value = '';
                    return;
                }
                if (act === 'detail') {
                    const pop = el.parentNode.querySelector('.rate-pop');
                    closeDetails(pop);
                    pop.hidden = !pop.hidden;
                    el.setAttribute('aria-expanded', String(!pop.hidden));
                    return;
                }
                if (act === 'my-pick') {
                    // 내 배율 난이도 선택: 행의 CSV 키와 같으면 기본값(null)으로 저장
                    const ctx = rowCtx(el);
                    if (!ctx) return;
                    const tr = el.closest('tr[data-row]');
                    const row = scheduleRows(ctx.p).find((r) => r.rowKey === tr.dataset.row);
                    ctx.conf.myKey = row && el.dataset.key === row.csvKey ? null : el.dataset.key;
                    return commit();
                }
            });

            $view.addEventListener('change', (e) => {
                const el = e.target;
                const act = el.dataset.act;

                if (act === 'base-minutes') {
                    const n = parseFloat(el.value);
                    if (n > 0) state.settings.baseMinutes = n;
                    return commit();
                }

                const ctx = rowCtx(el);
                if (!ctx) return;
                const { p, conf } = ctx;
                const tr = el.closest('tr[data-row]');

                if (act === 'add-party' || act === 'add-rate') {
                    // 빈칸 · 0 = null
                    const key = act === 'add-party' ? 'addParty' : 'addRate';
                    conf[key] = clampDigits(el.value, act === 'add-party' ? PARTY_DIGITS : RATE_DIGITS);
                    return commit();
                }
                if (act === 'buff') {
                    conf.buff[el.dataset.buff] = el.checked;
                    return commit();
                }
                if (act === 'champ-num') {
                    conf.buff.champ = clampChamp(el.value);
                    return commit();
                }
            });

            // 숫자 입력칸: 숫자만 (유챔 5자리, 인원 1자리, 배율 3자리)
            const DIGIT_INPUTS = { 'champ-num': CHAMP_MAX_DIGITS, 'add-party': PARTY_DIGITS, 'add-rate': RATE_DIGITS };
            $view.addEventListener('input', (e) => {
                const el = e.target;
                const max = DIGIT_INPUTS[el.dataset.act];
                if (!max) return;
                const digits = el.value.replace(/\D/g, '').slice(0, max);
                if (digits !== el.value) el.value = digits;
            });

            // 엔터 키로 입력 확정
            $view.addEventListener('keydown', (e) => {
                const act = e.target.dataset.act;
                if (e.key === 'Enter' && (act in DIGIT_INPUTS || act === 'base-minutes')) {
                    e.target.blur();
                }
            });

            /* ════════════════ 시작 ════════════════ */

            Theme.mount(document.getElementById('btnTheme'));
            ApiKeyBox.mount($keyBox);

            // 키 저장 시 박스 닫고 다시 조회, 삭제 시 박스 열기
            ApiKey.onChange(() => {
                renderKeyState();
                setKeyBoxOpen(!ApiKey.has());
                loadAll();
            });

            renderKeyState();
            setKeyBoxOpen(!ApiKey.has()); // 처음 방문(키 없음)이면 열어 둔다
            render();
            loadAll();

            // 탭을 오래 열어 둔 뒤 다시 볼 때 클리어 다시 조회
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible' && Date.now() - lastLoad > REFRESH_MS) loadAll();
            });
        })();
    </script>
</body>

</html>
