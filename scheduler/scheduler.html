<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스케줄러</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../base_css/base.css">
    <link rel="stylesheet" href="../base_css/dark.css">
    <link rel="stylesheet" href="../base_css/light.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/api_key_box.css">
    <link rel="stylesheet" href="css/character_picker.css">
    <link rel="stylesheet" href="css/schedule_board.css">
    <link rel="stylesheet" href="css/difficulty_badge.css">
    <link rel="stylesheet" href="css/scheduler.css">
    <!-- 저장된 테마를 그리기 전에 적용 (깜빡임 방지) -->
    <script src="../base_js/theme.js"></script>
</head>

<body>
    <a class="back-link" href="../index.html">← maple_util</a>

    <!-- 우상단 구석: 테마 전환 + API 키 등록 버튼 + 펼침 박스 -->
    <div class="key-corner">
        <div class="corner-row">
            <button type="button" class="top-btn" id="btnTheme"></button>
            <button type="button" class="top-btn" id="btnApiKey" aria-controls="apiKeyBox" aria-expanded="false">
                API 키 등록 <span class="top-btn-state"></span>
            </button>
        </div>
        <section id="apiKeyBox" hidden></section>
    </div>

    <div class="container">
        <nav class="top-actions" aria-label="캐릭터">
            <button type="button" class="top-btn" id="btnCharacters" aria-controls="characterPicker">
                캐릭터 등록/해제
            </button>
        </nav>

        <section id="characterPicker" hidden></section>

        <div id="scheduleBoard"></div>

        <footer class="site-footer">
            Data based on <a href="https://openapi.nexon.com/" target="_blank" rel="noopener">NEXON Open API</a>
        </footer>
    </div>

    <!-- 순서 중요: 공통 → 데이터 → API → UI → 페이지 -->
    <script src="js/util.js"></script>
    <script src="js/store.js"></script>
    <script src="js/reset.js"></script>
    <script src="js/api_key.js"></script>
    <script src="js/nexon_api.js"></script>
    <script src="js/characters.js"></script>
    <script src="js/scheduler_state.js"></script>
    <script src="js/difficulty.js"></script>
    <script src="js/api_key_box.js"></script>
    <script src="js/character_picker.js"></script>
    <script src="js/board_rules.js"></script>
    <script src="js/board_ui.js"></script>
    <script src="js/board_weekly.js"></script>
    <script src="js/board_boss.js"></script>
    <script src="js/board_daily.js"></script>
    <script src="js/schedule_board.js"></script>
    <script src="js/scheduler.js"></script>
</body>

</html>
